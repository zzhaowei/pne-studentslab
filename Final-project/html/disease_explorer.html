<!DOCTYPE html>
<html lang="en">
<head><title>Diasease Explorer Report</title></head>
<body style="background-color: rgb(244,234,215); font-family: sans-serif; margin: 30px;">
    <h2>Genes summary</h2>
    <h3>Gene requested ({{ gene }}):</h3>
    <h3>total associated diseases ({{ total_num }}):</h3>
    <h3>filtering source: ({{ source }}):</h3>


    <div style='width: 600px; height: 300px; overflow: auto; border: 1px solid #bbb; padding: 10px; background-color: #eee;'>
        <h3>Phenotype list:</h3>
        <h3>{{msg}}</h3>
        {% for description, source in dic.items() %}
            <p>· {{ description }}.  (source: {{ source }})</p>
        {% endfor %}
    </div>

    <br><a href="/">Back to Menu</a>
</body>
</html>
